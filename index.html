<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rendervertex</title>
    <style>
        /* General Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background-color: #000; /* Dark premium background like Deckor */
            color: #fff;
        }

        /* Header / Navbar */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            text-transform: uppercase;
        }

        /* Hero Section */
        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            /* Yahan aap apne portfolio ki sabse best image laga sakte hain, bina kisi color filter ke */
            background: url('hero-image-placeholder.jpg') center/cover no-repeat;
            position: relative;
        }

        .hero::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4); /* Sirf text readable banane ke liye slight dark overlay */
        }

        .hero-content {
            position: relative;
            z-index: 10;
        }

        .hero h1 {
            font-size: 50px;
            font-weight: 300;
            margin-bottom: 20px;
            letter-spacing: 3px;
        }

        /* Portfolio Grid Section */
        .portfolio-section {
            padding: 100px 50px;
        }

        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
        }

        .portfolio-item {
            position: relative;
            overflow: hidden;
            border-radius: 4px;
        }

        .portfolio-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease;
        }

        .portfolio-item:hover img {
            transform: scale(1.05); /* Smooth zoom effect */
        }

        /* Text Block (For later use) */
        .text-block {
            padding: 80px 50px;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
        }

        /* Footer */
        footer {
            padding: 50px;
            text-align: center;
            border-top: 1px solid #333;
            margin-top: 50px;
        }
        
        footer p {
            margin: 10px 0;
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">Rendervertex</div>
        <div class="nav-links">
            <a href="#">[Nav 1]</a>
            <a href="#">[Nav 2]</a>
            <a href="#">[Nav 3]</a>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <h1>[ Hero Title Placeholder ]</h1>
            <p>[ Subtitle / Tagline Placeholder ]</p>
        </div>
    </section>

    <!-- About / Info Section (Ready for your text later) -->
    <section class="text-block">
        <h2>[ Main Heading Placeholder ]</h2>
        <br>
        <p>[ Description Placeholder - Yahin par aapka paragraph text aayega ]</p>
    </section>

    <!-- Portfolio Gallery -->
    <section class="portfolio-section">
        <div class="portfolio-grid">
            <!-- PDF ki images ke liye original layouts -->
            <div class="portfolio-item"><img src="path_to_four_poster_bed_room.jpg" alt="Luxury Bedroom 1"></div>
            <div class="portfolio-item"><img src="path_to_bright_bedroom.jpg" alt="Modern Bedroom"></div>
            <div class="portfolio-item"><img src="path_to_green_sofa_room.jpg" alt="Green Sofa Lounge"></div>
            <div class="portfolio-item"><img src="path_to_beige_sofa_living.jpg" alt="Classic Living Room"></div>
            <div class="portfolio-item"><img src="path_to_marble_bathroom_black.jpg" alt="Black Marble Bathroom"></div>
            <div class="portfolio-item"><img src="path_to_marble_bathroom_grey.jpg" alt="Grey Marble Bathroom"></div>
            <div class="portfolio-item"><img src="path_to_elevator_corridor.jpg" alt="Elevator Corridor"></div>
            <div class="portfolio-item"><img src="path_to_bar_lounge.jpg" alt="Bar Area"></div>
            <!-- Aap yahan apni bachi hui sabhi 3D renders laga sakte hain -->
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="logo">Rendervertex</div>
        <p>[ Footer Text Placeholder ]</p>
        <p>+91 9711216611 | WWW.RENDERVERTEX.COM</p>
    </footer>

</body>
</html>
